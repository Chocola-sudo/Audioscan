name: Compilar APK

on:
  workflow_dispatch:
    inputs:
      modelos:
        description: "Modelos Whisper a incluir (tiny base small)"
        default: "small"
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descargar librería y modelos Whisper dentro de la app
        env:
          DESTINO: www
        run: python3 descargar.py lib ${{ github.event.inputs.modelos || 'small' }}

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Parchar permisos, servicio y memoria
        run: python3 tools/parchar_android.py

      - name: Sincronizar
        run: npx cap sync android

      # Java va DESPUÉS de crear el proyecto Android: setup-java busca archivos
      # de Gradle y fallaba cuando todavía no existían.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioScan-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
